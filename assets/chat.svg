<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="t d">
  <title id="t">Adam Suchi Hafizullah</title>
  <desc id="d">A WhatsApp-style chat. "Hi Adam, what do you build?" "Software engineer in Indonesia. I ship products end to end: backend, web, mobile, desktop, and open-source the parts that outlive the project." "What's the latest?" "rpt-mcp: an MCP server that lets AI assistants read and edit SAP Crystal Reports .rpt files."</desc>
  <style>
    :root{--bg:#efeae2;--head:#008069;--headtx:#fff;--headsub:#d9fdd3;--in:#fff;--out:#d9fdd3;--tx:#111b21;--meta:#667781;--chip:#ffeecd;--chiptx:#54656f;--date:#fff;--card:#cfe9c6;--link:#027eb5;--tick:#53bdeb;--av:#dfe5e7;--avtx:#54656f}
    @media (prefers-color-scheme:dark){:root{--bg:#0b141a;--head:#202c33;--headtx:#e9edef;--headsub:#8696a0;--in:#202c33;--out:#005c4b;--tx:#e9edef;--meta:#ffffff99;--chip:#182229;--chiptx:#ffd279;--date:#182229;--card:#025144;--link:#53bdeb;--av:#6a7175;--avtx:#e9edef}}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--tx);font-size:15px}
    .meta{fill:var(--meta);font-size:11px}
    .in{fill:var(--in)} .out{fill:var(--out)}
    .m{opacity:0;animation:pop .35s ease-out forwards}
    @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .dot{fill:var(--meta);animation:blink 1.2s infinite}
    @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.m{animation:none;opacity:1}.dot{animation:none}}
  </style>

  <rect width="760" height="540" rx="14" fill="var(--bg)"/>

  <!-- header -->
  <path d="M0 14a14 14 0 0 1 14-14h732a14 14 0 0 1 14 14v50H0z" fill="var(--head)"/>
  <circle cx="40" cy="32" r="20" fill="var(--av)"/>
  <text x="40" y="37" text-anchor="middle" style="fill:var(--avtx);font-size:14px;font-weight:600">AS</text>
  <text x="72" y="28" style="fill:var(--headtx);font-size:16px;font-weight:600">Adam Suchi Hafizullah</text>
  <text x="72" y="47" style="fill:var(--headsub);font-size:13px">online</text>
  <g fill="var(--headtx)"><circle cx="732" cy="24" r="2.2"/><circle cx="732" cy="32" r="2.2"/><circle cx="732" cy="40" r="2.2"/></g>

  <!-- encryption notice -->
  <rect x="150" y="80" width="460" height="28" rx="7" fill="var(--chip)"/>
  <text x="380" y="99" text-anchor="middle" style="fill:var(--chiptx);font-size:12.5px">🔒 Messages are end-to-end encrypted. Only this README can read them.</text>
  <rect x="352" y="120" width="56" height="24" rx="7" fill="var(--date)"/>
  <text x="380" y="136" text-anchor="middle" class="meta" style="font-size:12px">TODAY</text>

  <!-- 1: incoming -->
  <g class="m" style="animation-delay:.3s">
    <path d="M24 158h-8l8 10z" class="in"/>
    <rect x="24" y="158" width="300" height="36" rx="8" class="in"/><rect x="24" y="158" width="10" height="10" class="in"/>
    <text x="36" y="182">Hi Adam 👋 what do you build?</text>
    <text x="314" y="188" text-anchor="end" class="meta">09:41</text>
  </g>

  <!-- 2: outgoing -->
  <g class="m" style="animation-delay:1.1s">
    <path d="M736 206h8l-8 10z" class="out"/>
    <rect x="316" y="206" width="420" height="58" rx="8" class="out"/><rect x="726" y="206" width="10" height="10" class="out"/>
    <text x="328" y="229">Software engineer in Indonesia. I ship products</text>
    <text x="328" y="251">end to end — backend, web, mobile, desktop.</text>
    <text x="704" y="258" text-anchor="end" class="meta">09:42</text>
    <text x="728" y="258" text-anchor="end" class="meta" style="fill:var(--tick);font-size:12px">✓✓</text>
  </g>

  <!-- 3: outgoing (grouped) -->
  <g class="m" style="animation-delay:1.8s">
    <rect x="270" y="268" width="466" height="36" rx="8" class="out"/>
    <text x="282" y="291">…and open-source the parts that outlive the project.</text>
    <text x="704" y="298" text-anchor="end" class="meta">09:42</text>
    <text x="728" y="298" text-anchor="end" class="meta" style="fill:var(--tick);font-size:12px">✓✓</text>
  </g>

  <!-- 4: incoming -->
  <g class="m" style="animation-delay:2.6s">
    <path d="M24 316h-8l8 10z" class="in"/>
    <rect x="24" y="316" width="252" height="36" rx="8" class="in"/><rect x="24" y="316" width="10" height="10" class="in"/>
    <text x="36" y="340">Nice. What's the latest?</text>
    <text x="266" y="346" text-anchor="end" class="meta">09:43</text>
  </g>

  <!-- 5: outgoing link preview -->
  <g class="m" style="animation-delay:3.4s">
    <path d="M736 364h8l-8 10z" class="out"/>
    <rect x="296" y="364" width="440" height="128" rx="8" class="out"/><rect x="726" y="364" width="10" height="10" class="out"/>
    <rect x="300" y="368" width="432" height="62" rx="6" fill="var(--card)"/>
    <text x="312" y="391" style="font-weight:600">ashafizullah/rpt-mcp</text>
    <text x="312" y="411" style="font-size:13px;fill:var(--meta)">MCP server for SAP Crystal Reports .rpt files</text>
    <text x="312" y="425" style="font-size:11.5px;fill:var(--meta)">github.com</text>
    <text x="308" y="454">Just shipped: AI assistants can now edit .rpt files 🚀</text>
    <text x="308" y="476" style="fill:var(--link)">github.com/ashafizullah/rpt-mcp</text>
    <text x="704" y="484" text-anchor="end" class="meta">09:43</text>
    <text x="728" y="484" text-anchor="end" class="meta" style="fill:var(--tick);font-size:12px">✓✓</text>
  </g>

  <!-- 6: typing -->
  <g class="m" style="animation-delay:4.4s">
    <path d="M24 500h-8l8 10z" class="in"/>
    <rect x="24" y="500" width="64" height="30" rx="8" class="in"/><rect x="24" y="500" width="10" height="10" class="in"/>
    <circle cx="42" cy="515" r="3.5" class="dot"/>
    <circle cx="56" cy="515" r="3.5" class="dot" style="animation-delay:.2s"/>
    <circle cx="70" cy="515" r="3.5" class="dot" style="animation-delay:.4s"/>
  </g>
</svg>
